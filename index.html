<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiet Orbits</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one full-bleed low-res sky; a single control strip docked to the bottom edge that steps away when idle. */
:root{
  color-scheme: dark;
  --ink:#1d1a26;      /* space, panel ground (follows the active palette) */
  --lit:#f1e9cf;      /* text, borders */
  --mid:#6f6a86;      /* quiet labels, dividers */
  --accent:#c98a6b;   /* focus, pressed state */
  --font-ui:'Silkscreen','Lucida Console',ui-monospace,'Courier New',monospace;
}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--lit);font-family:var(--font-ui);
  font-size:11px;line-height:1.2;overflow:hidden;
  -webkit-font-smoothing:none;font-smooth:never;
}
#sky{
  position:fixed;left:0;top:0;display:block;
  image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;
  touch-action:none;cursor:grab;
}
body.idle #sky{cursor:none}
body.dragging #sky{cursor:grabbing}

.hud{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--ink);border-top:2px solid var(--lit);
  transition:transform .35s steps(7,end);
}
body.idle .hud:not(:focus-within){transform:translateY(105%)}
@media (prefers-reduced-motion:reduce){.hud{transition:none}}

.grp{display:flex;flex-direction:column;gap:4px;min-width:0}
.grp > .lbl{color:var(--mid);letter-spacing:.12em;text-transform:uppercase;font-size:10px}
.row{display:flex;gap:4px;align-items:stretch;flex-wrap:wrap}
.brand{font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0;align-self:center;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:10px;letter-spacing:.1em;color:var(--mid);margin-top:3px}

button,input[type=text]{
  font:inherit;color:var(--lit);background:var(--ink);
  border:2px solid var(--lit);border-radius:0;
  padding:4px 7px;min-height:26px;margin:0;
  text-transform:uppercase;letter-spacing:.06em;
}
button{cursor:pointer;white-space:nowrap}
button:hover{background:var(--lit);color:var(--ink)}
button:active{background:var(--accent);border-color:var(--accent);color:var(--ink)}
button[aria-pressed="true"]{background:var(--lit);color:var(--ink)}
button[aria-pressed="false"]{border-color:var(--mid);color:var(--mid)}
button[aria-pressed="false"]:hover{background:var(--mid);color:var(--ink)}
button.name{min-width:9.5em;text-align:center}
input[type=text]{width:11em;text-transform:lowercase;cursor:text}
input[type=text]::selection{background:var(--lit);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:12px;background:transparent;margin:0;display:block;
}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--mid)}
input[type=range]::-moz-range-track{height:4px;background:var(--mid)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:12px;margin-top:-4px;background:var(--lit);border:0;border-radius:0}
input[type=range]::-moz-range-thumb{width:8px;height:12px;background:var(--lit);border:0;border-radius:0}

#swatch{display:flex;height:6px;border:2px solid var(--lit)}
#swatch i{flex:1;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<canvas id="sky" role="img" aria-label="A slowly drifting, procedurally generated solar system drawn in a limited pixel palette"></canvas>

<div class="hud" id="hud">
  <p class="brand">Quiet Orbits<small>drag to turn · tap a world</small></p>

  <form class="grp" id="seed-form" autocomplete="off">
    <label class="lbl" for="seed">Seed</label>
    <div class="row">
      <input type="text" id="seed" maxlength="40" spellcheck="false" autocapitalize="off" aria-describedby="seed-help">
      <button type="submit" id="btn-go" title="Visit this seed (Enter)">Go</button>
      <button type="button" id="btn-roll" title="Random system (Space)">Roll</button>
    </div>
    <span class="sr" id="seed-help">Any text. The same seed always makes the same system.</span>
  </form>

  <div class="grp">
    <span class="lbl" id="l-pal">Palette</span>
    <div class="row" role="group" aria-labelledby="l-pal">
      <button type="button" id="pal-prev" aria-label="Previous palette">&lt;</button>
      <button type="button" id="pal-name" class="name" title="Next palette (P)"></button>
      <button type="button" id="pal-next" aria-label="Next palette">&gt;</button>
    </div>
    <div id="swatch" aria-hidden="true"></div>
  </div>

  <div class="grp">
    <span class="lbl" id="l-dit">Dither</span>
    <div class="row" role="group" aria-labelledby="l-dit">
      <button type="button" id="dit-prev" aria-label="Previous dither pattern">&lt;</button>
      <button type="button" id="dit-name" class="name" title="Next dither pattern (D)"></button>
      <button type="button" id="dit-next" aria-label="Next dither pattern">&gt;</button>
    </div>
    <input type="range" id="dit-amt" min="0" max="100" step="5" aria-label="Dither amount">
  </div>

  <div class="grp">
    <span class="lbl">Pixels</span>
    <button type="button" id="px" title="Pixel size (X)"></button>
  </div>

  <div class="grp">
    <span class="lbl">Journey</span>
    <button type="button" id="mode" title="Wander: tour, then drift to a new system. Tour: stay in this system. Still: hold this view. (M)"></button>
  </div>

  <div class="grp">
    <span class="lbl" id="l-world">World</span>
    <div class="row" role="group" aria-labelledby="l-world">
      <button type="button" id="w-prev" aria-label="Previous world">&lt;</button>
      <button type="button" id="w-sys" title="Whole system (Esc)">System</button>
      <button type="button" id="w-next" aria-label="Next world">&gt;</button>
    </div>
  </div>

  <div class="grp">
    <span class="lbl" id="l-show">Show</span>
    <div class="row" role="group" aria-labelledby="l-show">
      <button type="button" id="t-orb" aria-pressed="true" title="Orbit lines (O)">Orbits</button>
      <button type="button" id="t-con" aria-pressed="true" title="Constellation lines (C)">Figures</button>
      <button type="button" id="t-lab" aria-pressed="true" title="Name captions (L)">Names</button>
      <button type="button" id="btn-full" title="Fullscreen (F)">Full</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ───────────── small maths ───────────── */

const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const mul3 = (a, k) => [a[0]*k, a[1]*k, a[2]*k];

/* ───────────── palettes (dark → light, hand-tuned) ───────────── */
const PALETTES = [
  { name: 'Dustlight', c: ['#2b2530','#4c4760','#526f8c','#8a5566','#8f9a6c','#c9a36e','#bcdbe0','#f3ecc8'] },
  { name: 'Orrery',    c: ['#0d0d1d','#24315f','#2f7c86','#6aae69','#d8b25a','#b4513d','#d6d0c3','#fdf8ea'] },

  { name: 'Kiln',      c: ['#190e13','#662331','#d55c38','#f6d79c'] },
  { name: 'Nocturne',  c: ['#130c21','#3a2052','#853b70','#dd676a','#f3b178','#fbeed3'] },

  { name: 'Eclipse',   c: ['#0c0509','#8a1d2c','#f1e3cf'] },
  { name: 'One Bit',   c: ['#0c0c14','#e9e6d6'] },
  { name: 'Almanac',   c: ['#efe6cf','#b9ad90','#8e4a3a','#29273a'], invert: true },
  { name: 'Spectrum',  c: ['#0e0c1b','#2a2247','#4e3b78','#24415d','#2e6e73','#4ea569','#a8d05c','#f1e17a','#efa74a','#d8623b','#a7333f','#6d2648','#896a5b','#c8b19b','#9ed3df','#fbf7ea'] },

  p.rgb = p.c.map(h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]);

const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d', { alpha: false });

let buf, depth, thrOv, thrMap, img, out32, skyGrid;
const GRID = 4; let GW = 0, GH = 0;

function resize() {
  const ww = Math.max(64, window.innerWidth), wh = Math.max(64, window.innerHeight);
  const target = PIXELS[S.px].h;
  scale = Math.max(1, Math.round(Math.sqrt(ww * wh / (target * target * 16 / 9))));
  W = Math.ceil(ww / scale); H = Math.ceil(wh / scale);
  canvas.width = W; canvas.height = H;
  canvas.style.width = W * scale + 'px'; canvas.style.height = H * scale + 'px';
  buf = new Float32Array(W * H * 3); depth = new Float32Array(W * H); thrOv = new Uint8Array(W * H); thrMap = new Uint8Array(W * H);
  img = ctx.createImageData(W, H); out32 = new Uint32Array(img.data.buffer);
  GW = Math.ceil(W / GRID) + 1; GH = Math.ceil(H / GRID) + 1; skyGrid = new Float32Array(GW * GH * 3);
  MINWH = Math.min(W, H); F = 2 * MINWH; CX = W / 2; CY = H / 2;

}

  const f = DITHERS[S.dit].f, amt = S.amt / 100;
  for (let y = 0, p = 0; y < H; y++) for (let x = 0; x < W; x++, p++)
    thrMap[p] = clamp(Math.round(255 * (0.5 + (f(x, y) - 0.5) * amt)), 1, 254);

/* ───────────── surface shaders ─────────────
   Each returns flat, banded colour for a point on the unit sphere (y is the spin axis).
   Results land in the s* registers below. */
let sR = 0, sG = 0, sB = 0, sE0 = 0, sE1 = 0, sE2 = 0, sSpec = 0, sTag = 0;

function mkTerran(R, ocean) {
  const f = R.range(1.1, 1.9), ox = R.range(-60, 60), oy = R.range(-60, 60), oz = R.range(-60, 60);
  const sea = ocean ? R.range(0.09, 0.19) : R.range(-0.09, 0.05);
  const vegH = R.weighted([[105,4],[130,2],[80,2],[160,1.5],[285,1],[20,1],[335,1]]);
  const seaH = R.weighted([[212,4],[198,2],[228,2],[180,1.5],[262,1],[150,.7]]);
  const deep = hsv(seaH, .62, .34), shallow = hsv(seaH - 10, .5, .58);
  const shore = hsv(vegH - 55, .28, .86), low = hsv(vegH, .46, .62), mid = hsv(vegH + 18, .5, .44);
  const arid = hsv(vegH - 70, .4, .66), high = hsv(vegH - 80, .2, .5), peak = hsv(seaH, .05, .93);
  const ice = hsv(seaH - 10, .1, .96), iceLat = R.range(.66, .9);
  return (x, y, z, oct) => {
    sE0 = sE1 = sE2 = 0; sSpec = 0; sTag = 0;
    const h = fbm(x*f + ox, y*f + oy, z*f + oz, oct);
    const lat = y < 0 ? -y : y;
    if (lat + noise3(x*5 + oz, y*5 + ox, z*5 + oy) * 0.07 > iceLat) return put(ice);
    if (h < sea) { sSpec = 1; return put(sea - h > 0.085 ? deep : shallow); }
    const e = h - sea;
    if (e < 0.016) return put(shore);
    if (e < 0.085) { sTag = 1; return put(noise3(x*1.7 + oy, y*1.7 + oz, z*1.7 + ox) - lat * 0.32 > -0.12 ? low : arid); }

}
function mkDesert(R) {
  const f = R.range(1.2, 2.2), ox = R.range(-60, 60), oy = R.range(-60, 60), oz = R.range(-60, 60);
  const h0 = R.weighted([[28,4],[14,2],[42,2],[350,1],[65,.8]]);
  const ramp = [hsv(h0, .5, .42), hsv(h0 + 8, .46, .6), hsv(h0 + 14, .38, .76), hsv(h0 - 12, .52, .52), hsv(h0 + 20, .22, .88)];

    sE0 = sE1 = sE2 = 0; sSpec = 0; sTag = 0;
    const lat = y < 0 ? -y : y;
    if (lat + noise3(x*4 + oz, y*4, z*4 + ox) * 0.06 > capLat) return put(cap);
    const h = fbm(x*f + ox, y*f + oy, z*f + oz, oct);
    if (oct > 2 && Math.abs(noise3(x*2.1 + oy, y*2.1 + oz, z*2.1 + ox)) < 0.022) return put(scar);

function mkIce(R) {
  const f = R.range(1.3, 2.1), ox = R.range(-60, 60), oy = R.range(-60, 60), oz = R.range(-60, 60);
  const h0 = R.weighted([[200,4],[185,2],[220,2],[165,1],[250,1]]);
  const a = hsv(h0, .05, .98), b = hsv(h0 - 6, .26, .9), c = hsv(h0 + 6, .46, .7), crack = hsv(h0 + 15, .58, .42);
  return (x, y, z, oct) => {
    sE0 = sE1 = sE2 = 0; sSpec = 0; sTag = 0;
    const h = fbm(x*f + ox, y*f + oy, z*f + oz, oct);
    if (oct > 2 && h < 0.12 && Math.abs(noise3(x*3 + oy, y*3 + oz, z*3 + ox)) < 0.026) return put(crack);
    put(h > 0.07 ? a : h > -0.07 ? b : c);

function mkLava(R) {
  const f = R.range(1.3, 2.2), ox = R.range(-60, 60), oy = R.range(-60, 60), oz = R.range(-60, 60);
  const h0 = R.weighted([[16,4],[4,2],[30,2],[320,.6],[190,.4]]);
  const c0 = hsv(h0 + 200, .25, .16), c1 = hsv(h0 + 190, .2, .27), c2 = hsv(h0, .3, .38);

function mkBarren(R) {

function mkGas(R) {

  const h0 = R.weighted([[28,3],[44,2.5],[212,2.5],[176,2],[282,1.2],[348,1.2],[128,1]]);
  const ramp = [hsv(h0 - 8, .5, .4), hsv(h0, .48, .58), hsv(h0 + 10, .38, .74), hsv(h0 + 18, .2, .9), hsv(h0 + R.pick([-40, 150, 40]), .42, .6)];

function mkShroud(R) {
  const ox = R.range(-60, 60), oy = R.range(-60, 60), oz = R.range(-60, 60);
  const h0 = R.weighted([[40,3],[25,2],[70,1.5],[300,1],[160,1],[200,1]]);

const KINDS = {
  terran: { label: 'Living world', mk: R => mkTerran(R, false), atmo: R => ({ h: R.pick([205, 195, 220, 180]), s: .5, dens: R.range(.5, .75), w: R.range(.14, .22) }), cloud: [.3, .62] },
  ocean:  { label: 'Ocean world',  mk: R => mkTerran(R, true),  atmo: R => ({ h: R.pick([200, 190, 215, 170]), s: .45, dens: R.range(.55, .8), w: R.range(.15, .24) }), cloud: [.45, .75] },
  desert: { label: 'Desert world', mk: mkDesert, atmo: R => ({ h: R.pick([28, 18, 40]), s: .4, dens: R.range(.25, .5), w: R.range(.08, .14) }), cloud: [0, .22] },
  ice:    { label: 'Ice world',    mk: mkIce,    atmo: R => ({ h: R.pick([195, 210, 180]), s: .3, dens: R.range(.15, .4), w: R.range(.05, .1) }), cloud: [0, .2] },
  lava:   { label: 'Molten world', mk: mkLava,   atmo: R => ({ h: R.pick([12, 24, 355]), s: .6, dens: R.range(.25, .5), w: R.range(.07, .13) }), cloud: [0, 0] },
  barren: { label: 'Barren world', mk: mkBarren, atmo: null, cloud: [0, 0] },
  gas:    { label: 'Gas giant',    mk: mkGas,    atmo: R => ({ h: -1, s: .3, dens: R.range(.45, .7), w: R.range(.1, .16) }), cloud: [0, 0] },
  shroud: { label: 'Shrouded world', mk: mkShroud, atmo: R => ({ h: -1, s: .35, dens: R.range(.8, .95), w: R.range(.22, .34) }), cloud: [0, 0] },

/* ───────────── system generation ───────────── */
const SYL_A = ['Ka','Vel','Tor','An','Is','Ome','Ru','Sel','Ny','Ar','Eu','Hal','Mi','Or','Tha','Ves','Zeph','Io','Lu','Cae','Bel','Dra','Fen','Gal','Ith','Jun','Kor','Mar','Nev','Oss','Pyr','Quil','Sah','Tam','Ul','Wen','Yl','Ash'];
const SYL_B = ['ra','lo','ti','ne','mu','sha','do','ri','va','en','ol','ae','ir','um','eth','a','o','i'];
const SYL_C = ['n','s','x','th','r','lia','nis','ros','ra','tor','phe','dra','mir','lune','ne','','',''];
const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X'];
const SEED_WORDS = ['vela','lyra','ember','halo','drift','quill','onyx','sable','nimbus','tessel','aurel','cinder','lumen','opal','rook','sorrel','thistle','umbra','wren','zephyr','calyx','mote','fathom','gossamer','hollow','indigo','juniper','kestrel','larkspur','marrow','pallas','saffron','tundra','willow'];
const randomSeed = () => SEED_WORDS[Math.floor(Math.random() * SEED_WORDS.length)] + '-' + String(Math.floor(Math.random() * 900) + 100);

function makeFrame(b, R, tilt) {
  const az = R.range(0, TAU), st = Math.sin(tilt), ct = Math.cos(tilt);
  b.ax = [st * Math.cos(az), ct, st * Math.sin(az)];
  let e1 = cross(b.ax, [0, 0, 1]); if (Math.hypot(e1[0], e1[1], e1[2]) < 0.05) e1 = cross(b.ax, [1, 0, 0]);
  b.e1 = norm(e1); b.e2 = cross(b.ax, b.e1);
  b.spin0 = R.range(0, TAU); b.pos = [0, 0, 0]; b.m = new Float32Array(9); b.lb = [0, 0, 1];
}
function avgColor(surf) {
  const r = mulberry32(7); let a = 0, b = 0, c = 0; const n = 56;
  for (let i = 0; i < n; i++) { const v = norm([r()*2-1, r()*2-1, r()*2-1]); surf(v[0], v[1], v[2], 3); a += sR + sE0*.3; b += sG + sE1*.3; c += sB + sE2*.3; }
  return [a/n, b/n, c/n];
}
function makeRing(R, tint) {
  const inner = R.range(1.35, 1.75), outer = inner + R.range(.55, 1.15), tab = new Float32Array(48);
  const debris = R.chance(.45);
  let v = R.range(.4, .9);
  for (let i = 0; i < 48; i++) {
    if (R.chance(.3)) v = R.chance(.25) ? 0 : R.range(.3, .95);
    tab[i] = v * smooth(0, 3, i) * smooth(0, 3, 47 - i);
  }
  const h = R.chance(.6) ? R.range(28, 48) : tint;
  return { inner, outer, tab, debris, col: hsv(h, R.range(.12, .34), R.range(.8, .95)), col2: hsv(h + R.pick([-150, 160, 30]), R.range(.2, .4), R.range(.55, .75)), ox: R.range(0, 50), spin: R.range(.02, .05) };
}
function makeWorld(R, kindName, radius, isMoon) {
  const K = KINDS[kindName], b = { kind: isMoon ? 'moon' : 'planet', type: kindName, label: K.label, R: radius, moons: [] };
  b.surf = K.mk(R);
  b.avg = avgColor(b.surf);
  if (K.atmo && !(isMoon && R.chance(.7))) {
    const a = K.atmo(R); let col;
    if (a.h < 0) { const m = Math.max(b.avg[0], b.avg[1], b.avg[2]) || 1; col = mix3(mul3(b.avg, .85 / m), [1, 1, 1], .35); }
    else col = hsv(a.h, a.s, 1);
    b.atmo = { col, dens: a.dens, w: a.w };
  } else b.atmo = null;
  const cv = R.range(K.cloud[0], K.cloud[1]);
  b.cloud = cv > 0.12 && !isMoon ? { thr: lerp(.2, -.1, cv), f: R.range(1.5, 2.4), ox: R.range(-40, 40), oz: R.range(-40, 40), rate: R.range(.008, .02) * (R.chance(.5) ? 1 : -1),
    col: hsv(R.pick([40, 200, 0]), .04, .98), col2: hsv(210, .12, .82) } : null;
  b.lights = kindName === 'terran' && R.chance(.16);
  b.spinP = kindName === 'gas' ? R.range(14, 26) : R.range(26, 70);
  if (R.chance(.12)) b.spinP = -b.spinP;
  return b;
}

let sys = null;
function generate(seed) {
  const R = RNG('qo:' + seed), s = { seed, bodies: [], planets: [] };
  s.name = R.pick(SYL_A) + R.pick(SYL_B) + R.pick(SYL_C);
  if (s.name.length < 5) s.name += R.pick(SYL_B);

  // star
  const cls = R.weighted([[{ n: 'Red dwarf', h: 8, s: .78, r: [6, 8] }, 3], [{ n: 'Orange star', h: 24, s: .68, r: [7, 10] }, 3],
    [{ n: 'Yellow star', h: 44, s: .55, r: [8, 11] }, 3], [{ n: 'White star', h: 52, s: .1, r: [8, 12] }, 2], [{ n: 'Blue star', h: 214, s: .4, r: [10, 13.5] }, 1]]);
  const star = { kind: 'star', type: 'star', label: cls.n, name: s.name, R: R.range(cls.r[0], cls.r[1]), col: hsv(cls.h, cls.s, 1), moons: [], spinP: R.range(60, 110) };
  makeFrame(star, R, R.range(0, .2));
  star.hot = mix3(star.col, [1, 1, 1], .82); star.midc = mix3(star.col, [1, 1, 1], .3); star.edge = mul3(hsv(cls.h - 6, Math.min(1, cls.s + .2), .9), 1);
  star.nx = R.range(0, 50);
  s.star = star; s.light = mix3(star.col, [1, 1, 1], .8); s.bodies.push(star);

  // planets
  const n = R.int(3, 8), bump = (t, c, w) => Math.exp(-(((t - c) / w) ** 2));
  let a = star.R * 3 + R.range(10, 16);
  const T0 = R.range(46, 70), a0 = a;
  for (let i = 0; i < n; i++) {
    const t = n > 1 ? i / (n - 1) : 0.4;
    const type = R.weighted([['lava', Math.max(0, 1 - t * 4) * 2.2], ['barren', .8], ['desert', 1.3 * bump(t, .25, .25)], ['terran', 1.7 * bump(t, .4, .22)],
      ['ocean', 1.2 * bump(t, .47, .22)], ['shroud', .7 * bump(t, .3, .2) + .5 * bump(t, .72, .2)], ['gas', 2 * smooth(.3, .62, t)], ['ice', 1.6 * smooth(.5, .95, t)]]);
    const rad = type === 'gas' ? R.range(3.1, 5) : R.range(1.05, 2.25);
    const p = makeWorld(R, type, rad, false);
    p.name = s.name + ' ' + ROMAN[i];
    const ringed = R.chance(type === 'gas' ? .25 : type === 'ice' ? .06 : .03);
    makeFrame(p, R, ringed ? R.range(.22, .6) : R.chance(.1) ? R.range(.6, 1.3) : R.range(0, .42));
    if (ringed) p.ring = makeRing(R, R.range(0, 360));
    const e = R.range(0, .1), inc = R.range(-.07, .07), node = R.range(0, TAU), peri = R.range(0, TAU);
    const rotY = (v, ang) => { const c = Math.cos(ang), s2 = Math.sin(ang); return [v[0]*c + v[2]*s2, v[1], -v[0]*s2 + v[2]*c]; };
    const rotX = (v, ang) => { const c = Math.cos(ang), s2 = Math.sin(ang); return [v[0], v[1]*c - v[2]*s2, v[1]*s2 + v[2]*c]; };
    p.orbit = { a, e, b: a * Math.sqrt(1 - e*e), period: T0 * Math.pow(a / a0, 1.5), M0: R.range(0, TAU),
      P: rotY(rotX(rotY([1, 0, 0], peri), inc), node), Q: rotY(rotX(rotY([0, 0, 1], peri), inc), node) };
    const pts = new Float32Array(161 * 3);
    for (let k = 0; k <= 160; k++) { const E = k / 160 * TAU, x = a * (Math.cos(E) - e), z = p.orbit.b * Math.sin(E);
      pts[k*3] = p.orbit.P[0]*x + p.orbit.Q[0]*z; pts[k*3+1] = p.orbit.P[1]*x + p.orbit.Q[1]*z; pts[k*3+2] = p.orbit.P[2]*x + p.orbit.Q[2]*z; }
    p.orbit.pts = pts;
    // moons
    const mc = type === 'gas' ? R.int(1, 4) : R.weighted([[0, 4.5], [1, 4], [2, 1.5]]);
    let ma = (p.ring ? p.ring.outer + .5 : 2.3) + R.range(0, .6);
    for (let j = 0; j < mc; j++) {
      const mt = R.weighted([['barren', 6], ['ice', 2.5], ['lava', .8], ['desert', 1]]);
      const mr = type === 'gas' ? R.range(.4, 1.1) : rad * R.range(.18, .32);
      const m = makeWorld(R, mt, mr, true);
      m.name = p.name + String.fromCharCode(65 + j); m.parent = p;
      makeFrame(m, R, R.range(0, .3));
      m.orbit = { a: ma * rad, period: R.range(9, 14) * Math.pow(ma / 2.3, 1.5), M0: R.range(0, TAU) };
      ma = ma * R.range(1.3, 1.55) + .2;
      p.moons.push(m); s.bodies.push(m);
    }
    s.planets.push(p); s.bodies.push(p);
    a = a * R.range(1.3, 1.56) + 3;
  }
  s.aMax = s.planets[n - 1].orbit.a;
  s.rMin = Math.min(...s.planets.map(p => p.R));
