<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiet Orbits</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one full-bleed low-res sky; a single control strip docked to the bottom edge that steps away when idle. */
:root{
  color-scheme: dark;
  --ink:#1d1a26;      /* space, panel ground (follows the active palette) */
  --lit:#f1e9cf;      /* text, borders */
  --mid:#6f6a86;      /* quiet labels, dividers */
  --accent:#c98a6b;   /* focus, pressed state */
  --font-ui:'Silkscreen','Lucida Console',ui-monospace,'Courier New',monospace;
}
html,body{height:100%;overscroll-behavior:none}
body{
  margin:0;background:var(--ink);color:var(--lit);font-family:var(--font-ui);
  font-size:11px;line-height:1.2;overflow:hidden;
  -webkit-font-smoothing:none;font-smooth:never;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
#sky{
  position:fixed;left:0;top:0;display:block;
  image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;
  touch-action:none;cursor:grab;
}
body.idle #sky{cursor:none}
body.dragging #sky{cursor:grabbing}

.hud{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--ink);border-top:2px solid var(--lit);
  transition:transform .35s steps(7,end);
}
body.idle .hud:not(:has(:focus-visible)), body.collapsed .hud{transform:translateY(105%)}
#mini{position:fixed;z-index:6;display:flex;gap:4px;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));transition:opacity .3s steps(4,end)}
body:not(.collapsed) #mini{display:none}
body.idle #mini:not(:has(:focus-visible)){opacity:0;pointer-events:none}
@media (pointer:coarse){
  button,select,input[type=text]{min-height:34px}
  #mini{gap:8px}
  #mini button{min-width:46px;min-height:42px}
}
@media (prefers-reduced-motion:reduce){.hud,#mini{transition:none}}

.grp{display:flex;flex-direction:column;gap:4px;min-width:0}
.grp > .lbl{color:var(--mid);letter-spacing:.12em;text-transform:uppercase;font-size:10px}
.row{display:flex;gap:4px;align-items:stretch;flex-wrap:wrap}
.brand{font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0;align-self:center;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:10px;letter-spacing:.1em;color:var(--mid);margin-top:3px}

button,input[type=text],select{
  font:inherit;color:var(--lit);background:var(--ink);
  border:2px solid var(--lit);border-radius:0;
  padding:4px 7px;min-height:26px;margin:0;
  text-transform:uppercase;letter-spacing:.06em;
}
button{cursor:pointer;white-space:nowrap}
select{
  -webkit-appearance:none;appearance:none;cursor:pointer;width:16em;max-width:100%;padding-right:22px;
  background-image:linear-gradient(45deg,transparent 50%,var(--lit) 50%),linear-gradient(135deg,var(--lit) 50%,transparent 50%);
  background-position:calc(100% - 11px) 50%,calc(100% - 6px) 50%;background-size:5px 5px;background-repeat:no-repeat;
}
select option,select optgroup{background:var(--ink);color:var(--lit);text-transform:none}
@media (hover:hover){
  button:hover{background:var(--lit);color:var(--ink)}
  button[aria-pressed="false"]:hover{background:var(--mid);color:var(--ink)}
}
button:active{background:var(--accent);border-color:var(--accent);color:var(--ink)}
button[aria-pressed="true"]{background:var(--lit);color:var(--ink)}
button[aria-pressed="false"]{border-color:var(--mid);color:var(--mid)}
button.name{min-width:9.5em;text-align:center}
input[type=text]{width:11em;text-transform:lowercase;cursor:text;-webkit-user-select:text;user-select:text}
input[type=text]::selection{background:var(--lit);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:12px;background:transparent;margin:0;display:block;
}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--mid)}
input[type=range]::-moz-range-track{height:4px;background:var(--mid)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:12px;margin-top:-4px;background:var(--lit);border:0;border-radius:0}
input[type=range]::-moz-range-thumb{width:8px;height:12px;background:var(--lit);border:0;border-radius:0}

#swatch{display:flex;height:6px;border:2px solid var(--lit)}
#swatch i{flex:1;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<canvas id="sky" role="img" aria-label="A slowly drifting, procedurally generated solar system drawn in a limited pixel palette"></canvas>

<div class="hud" id="hud">
  <p class="brand">Quiet Orbits<small>drag · pinch · tap a world</small></p>

  <form class="grp" id="seed-form" autocomplete="off">
    <label class="lbl" for="seed">Seed</label>
    <div class="row">
      <input type="text" id="seed" maxlength="40" spellcheck="false" autocapitalize="off" aria-describedby="seed-help">
      <button type="submit" id="btn-go" title="Visit this seed (Enter)">Go</button>
      <button type="button" id="btn-roll" title="Random system (Space)">Roll</button>
    </div>
    <span class="sr" id="seed-help">Any text. The same seed always makes the same system.</span>
  </form>

  <div class="grp">
    <span class="lbl" id="l-pal">Palette</span>
    <div class="row" role="group" aria-labelledby="l-pal">
      <button type="button" id="pal-prev" aria-label="Previous palette">&lt;</button>
      <select id="pal" aria-labelledby="l-pal" title="Palette (P for next)"></select>
      <button type="button" id="pal-next" aria-label="Next palette">&gt;</button>
    </div>
    <div id="swatch" aria-hidden="true"></div>
  </div>

  <div class="grp">
    <span class="lbl" id="l-dit">Dither</span>
    <div class="row" role="group" aria-labelledby="l-dit">
      <button type="button" id="dit-prev" aria-label="Previous dither pattern">&lt;</button>
      <button type="button" id="dit-name" class="name" title="Next dither pattern (D)"></button>
      <button type="button" id="dit-next" aria-label="Next dither pattern">&gt;</button>
    </div>
    <input type="range" id="dit-amt" min="0" max="100" step="5" aria-label="Dither amount">
  </div>

  <div class="grp">
    <span class="lbl">Pixels</span>
    <button type="button" id="px" title="Pixel size (X)"></button>
  </div>

  <div class="grp">
    <span class="lbl">Journey</span>
    <button type="button" id="mode" title="Wander: tour, then drift to a new system. Tour: stay in this system. Still: hold this view. (M)"></button>
  </div>

  <div class="grp">
    <span class="lbl" id="l-world">World</span>
    <div class="row" role="group" aria-labelledby="l-world">
      <button type="button" id="w-prev" aria-label="Previous world">&lt;</button>
      <button type="button" id="w-sys" title="Whole system (Esc)">System</button>
      <button type="button" id="w-next" aria-label="Next world">&gt;</button>
    </div>
  </div>

  <div class="grp">
    <span class="lbl" id="l-show">Show</span>
    <div class="row" role="group" aria-labelledby="l-show">
      <button type="button" id="t-orb" aria-pressed="true" title="Orbit lines (O)">Orbits</button>
      <button type="button" id="t-con" aria-pressed="true" title="Constellation lines (C)">Figures</button>
      <button type="button" id="t-lab" aria-pressed="true" title="Name captions (L)">Names</button>
      <button type="button" id="btn-full" title="Fullscreen (F)">Full</button>
      <button type="button" id="btn-hide" title="Hide these controls until you bring them back (H)">Hide</button>
    </div>
  </div>
</div>
<div id="mini" role="group" aria-label="Quick controls">
  <button type="button" id="hud-tab" title="Show the controls (H)">Menu</button>
  <button type="button" id="mini-prev" aria-label="Previous world" title="Previous world (Left)">&lt;</button>
  <button type="button" id="mini-next" aria-label="Next world" title="Next world (Right)">&gt;</button>
</div>

{ const r = mulberry32(90210), p = new Uint8Array(256);

  const u = x*x*x*(x*(x*6-15)+10), v = y*y*y*(y*(y*6-15)+10), w = z*z*z*(z*(z*6-15)+10);

  const c0 = grad(PERM[AA+1], x, y, z1), c1 = grad(PERM[BA+1], x1, y, z1);

  }
}
function drawBelt() {
  const bl = sys.belt; if (!bl) return;

  for (let k = 0; k < bl.cnt; k++) {
    const ang = d[k*4+1] + d[k*4+2] * time, vx = Math.cos(ang) * d[k*4] - cp[0], vy = d[k*4+3] - cp[1], vz = Math.sin(ang) * d[k*4] - cp[2];
    const zc = -(vx*bk[0] + vy*bk[1] + vz*bk[2]); if (zc < 2) continue;
    const x = Math.floor(CX + F * (vx*cr[0] + vy*cr[1] + vz*cr[2]) / zc), y = Math.floor(CY + F * (vx*cd[0] + vy*cd[1] + vz*cd[2]) / zc);

}
function drawLets(p) { // small moons as single pixels; inner ones keep to the planet's equator, outer ones swarm on tilted paths

/* ───────────── captions (3×5 pixel type) ───────────── */
const WHITE = [1, 1, 1];
const GLYPHS = {
  A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',
  I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'1000111011101011000110001',N:'10011101101110011001',O:'010101101101010',P:'110101110100100',
  Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'1000110001101011101110001',X:'101101010101101',
  Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001',
  '5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110','-':'000000111000000','.':'000000000000010',
  '*':'000000010000000',' ':'000000000000000',

    for (let j = 0; j < g.length; j++) if (g[j] === '1') for (let a = 0; a < sc; a++) for (let b2 = 0; b2 < sc; b2++) {
      const px = x + (j % gw) * sc + a, py = y + (j / gw | 0) * sc + b2; if (px < 0 || py < 0 || px >= W || py >= H) continue;
      const p = py * W + px, i = p * 3; buf[i] = col[0] * k; buf[i+1] = col[1] * k; buf[i+2] = col[2] * k; thrOv[p] = k > 0.9 ? 128 : 0;
    }

  }
}
function drawLabel() {
  const k = clamp(labelT / 1.4, 0, 1); if (k <= 0) return;

  let l1, l2;
  if (!b) { l1 = sys.name; l2 = (sys.caption || sys.planets.length + ' worlds') + ' * ' + sys.star.label; }
  else if (b.kind === 'star') { l1 = sys.name; l2 = b.label; }
  else { const mc = b.moons.length + (b.lets ? b.lets.n : 0); l1 = b.name; l2 = (b.ring ? 'Ringed ' : '') + (b.kind === 'moon' ? b.label.replace('world', 'moon') : b.label) + (mc ? ' * ' + mc + (mc > 1 ? ' moons' : ' moon') : '') + (b.lights ? ' * lit at night' : ''); }
  drawText(l1, x, y, k, sc, WHITE); drawText(l2, x, y + 8 * sc, k, sc, PALETTES[S.pal].midc);
}

/* ───────────── frame ───────────── */
const order = [];
function render() {
  drawSky(); thrOv.fill(0); depth.fill(Infinity);
  drawStars(); drawFigures();
  order.length = 0;
  for (const b of sys.bodies) { project(b); if (b.kind === 'moon' && cam.o > 0.55) { b.vis = false; continue; } if (b.vis && b.sx > -W && b.sx < 2*W && b.sy > -H && b.sy < 2*H || (b.vis && b.kind === 'star')) order.push(b); }
  order.sort((a, b) => b.zc - a.zc);
  for (const b of order) { bodyMatrix(b); if (b.kind === 'star') drawStar(b); else drawBody(b); }
  if (S.orbits) drawOrbits();
  drawBelt();
  if (cam.o < 0.5) for (const p of sys.planets) if (p.lets && p.vis && p.rpx > 6) drawLets(p);

    if (r > 1) r = 1; if (g > 1) g = 1; if (b > 1) b = 1;
    const cell = ((Math.sqrt(r) * LN1 + .5 | 0) * LN + (Math.sqrt(g) * LN1 + .5 | 0)) * LN + (Math.sqrt(b) * LN1 + .5 | 0);
    out32[p] = lutT[cell] > (thrOv[p] || thrMap[p]) ? pal[lutB[cell]] : pal[lutA[cell]];
  }
  ctx.putImageData(img, 0, 0);
}

/* ───────────── journey ───────────── */
const tour = { list: [], i: 0, timer: 0 };
function buildTour() {
  const R = RNG('tour:' + sys.seed + ':' + (tour.round = (tour.round || 0) + 1));
  let ps = R.shuffle(sys.planets.slice());
  if (S.mode === 0 && ps.length > 4) ps = ps.slice(0, 4);
  tour.list = [null, ...ps]; if (R.chance(.4)) tour.list.splice(R.int(2, tour.list.length), 0, sys.star);
  tour.i = 0; tour.timer = 20;
}
const dwell = b => !b ? 22 : b.kind === 'star' ? 15 : 24 + (b.moons.length ? 4 : 0) + (b.ring ? 4 : 0);
function tourStep(dt) {
  if (S.mode === 2 || dragging || fadeDir < 0) return;
  tour.timer -= dt; if (tour.timer > 0) return;
  tour.i++;
  if (tour.i >= tour.list.length) { if (S.mode === 0) { warp(randomSeed()); return; } buildTour(); tour.timer = dwell(null); setFocus(null); return; }
  const b = tour.list[tour.i]; setFocus(b); tour.timer = dwell(b) + 6;
}
function warp(seed) { pendingSeed = String(seed); fadeDir = -1; }
function loadSystem(seed) {
  sys = generate(seed); time = 0; fitSystem(); updateBodies();
  cam.focus = null; cam.tr = null; cam.t = [0, 0, 0]; cam.o = 1; cam.pitchBase = 0.56; cam.userPitch = 0; cam.zoom = 1;
  cam.distBase = overviewDist * 1.5; cam.yaw = RNG('yaw:' + seed).range(0, TAU);
  cam.tr = { u: 0, dur: 7, from: [0, 0, 0], fromDist: overviewDist * 1.5, fromO: 1, fromPitch: 0.75, yawDelta: 0, lastE: 0, hump: 0 };
  labelT = -2.5; tour.round = 0; buildTour();
  seedInput.value = seed; syncWorldButtons();

    const ok = /^[A-Za-z0-9-]{1,40}$/.test(seed) && !/^(settings|sidebar|customize|upgrade|downloads|comment-.*)$/.test(seed);
    history.replaceState(null, '', ok ? '#' + seed : location.pathname + location.search);
  } catch (e) {}
}

let last = 0, dragging = false;
function frame(ts) {
  requestAnimationFrame(frame); // one render per display refresh
  const dt = Math.min(0.1, (ts - last) / 1000) * (reducedMotion ? 0.4 : 1); last = ts;
  step(dt); render();
}

/* ───────────── controls ───────────── */
const $ = id => document.getElementById(id);
const seedInput = $('seed');
function applyPalette() {
  const pal = PALETTES[S.pal]; buildLUT(pal);
  $('pal').value = String(S.pal);
  const sw = $('swatch'); sw.textContent = ''; for (const c of pal.c) { const i = document.createElement('i'); i.style.background = c; sw.appendChild(i); }
  const n = pal.c.length, ink = pal.c[pal.seq[0]], lit = pal.c[pal.seq[n - 1]];
  const mid = n >= 3 ? pal.c[pal.seq[Math.ceil((n - 1) / 2)]] : lit;
  let accent = lit, best = 0.12;
  pal.rgb.forEach((c, i) => { const ch = (Math.max(...c) - Math.min(...c)) / 255; if (pal.c[i] !== ink && pal.c[i] !== lit && ch > best) { best = ch; accent = pal.c[i]; } });
  const st = document.documentElement.style;

}
function syncUI() {
  $('dit-name').textContent = DITHERS[S.dit].name; $('dit-amt').value = S.amt;
  $('px').textContent = PIXELS[S.px].name; $('mode').textContent = MODES[S.mode];
  $('t-orb').setAttribute('aria-pressed', S.orbits); $('t-con').setAttribute('aria-pressed', S.lines); $('t-lab').setAttribute('aria-pressed', S.labels);
}
function syncWorldButtons() { const b = $('w-sys'); if (b) b.setAttribute('aria-pressed', cam.focus ? 'false' : 'true'); }
const cyc = (v, d, n) => (v + d + n) % n;
function setPal(d) { S.pal = cyc(S.pal, d, PALETTES.length); applyPalette(); save(); }
function setCollapsed(v) { S.collapsed = v; document.body.classList.toggle('collapsed', v); $('hud').inert = v; save(); }
function setDit(d) { S.dit = cyc(S.dit, d, DITHERS.length); buildThr(); syncUI(); save(); }

function hold() { tour.timer = Math.max(tour.timer, 40); } // a hand on the wheel pauses the tour for a while
function worldStep(d) {
  const list = [null, ...sys.planets], i = Math.max(0, list.indexOf(cam.focus && cam.focus.parent ? cam.focus.parent : cam.focus));
  setFocus(list[cyc(i, d, list.length)], QUICK); hold();
}
function roll() { const s = randomSeed(); seedInput.value = s; warp(s); }
function fullscreen() { try { if (document.fullscreenElement) document.exitFullscreen(); else { const p = document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } } catch (e) {} }

$('seed-form').addEventListener('submit', e => { e.preventDefault(); const v = seedInput.value.trim() || randomSeed(); warp(v); seedInput.blur(); });
$('btn-roll').addEventListener('click', roll);
{ const sel = $('pal'); // one group per palette size
  for (const g in PALETTE_GROUPS) { const og = document.createElement('optgroup'); og.label = PALETTE_GROUPS[g];
    PALETTES.forEach((q, i) => { if (q.g === g) { const o = document.createElement('option'); o.value = String(i); o.textContent = q.name + ' \u00b7 ' + q.c.length; og.appendChild(o); } });
    sel.appendChild(og); }
  sel.addEventListener('change', () => { S.pal = +sel.value; applyPalette(); save(); }); }
$('pal-prev').addEventListener('click', () => setPal(-1)); $('pal-next').addEventListener('click', () => setPal(1));
$('btn-hide').addEventListener('click', () => setCollapsed(true)); $('hud-tab').addEventListener('click', () => setCollapsed(false));
$('mini-prev').addEventListener('click', () => worldStep(-1)); $('mini-next').addEventListener('click', () => worldStep(1));
$('dit-prev').addEventListener('click', () => setDit(-1)); $('dit-next').addEventListener('click', () => setDit(1)); $('dit-name').addEventListener('click', () => setDit(1));
$('dit-amt').addEventListener('input', e => { S.amt = +e.target.value; buildThr(); save(); });
$('px').addEventListener('click', setPx); $('mode').addEventListener('click', setMode);
$('w-prev').addEventListener('click', () => worldStep(-1)); $('w-next').addEventListener('click', () => worldStep(1));
$('w-sys').addEventListener('click', () => { setFocus(null, QUICK); hold(); });
$('t-orb').addEventListener('click', () => toggle('orbits')); $('t-con').addEventListener('click', () => toggle('lines')); $('t-lab').addEventListener('click', () => toggle('labels'));
$('btn-full').addEventListener('click', fullscreen);

// idle: the strip steps away and the cursor hides
let idleTimer = 0;
function wake() { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add('idle'), 4200); }
['pointermove', 'pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => window.addEventListener(ev, wake, { passive: true }));

// pointer: one finger (or the mouse) turns, two fingers zoom, a tap picks a world

});

});

canvas.addEventListener('pointerup', endPointer); canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.zoom = clamp(cam.zoom * Math.exp(e.deltaY * 0.0012), ZOOM_MIN, ZOOM_MAX); hold(); }, { passive: false });
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false })); // keep Safari from zooming the page itself

let wakeLock = null;
function requestWake() { try { if (!wakeLock && navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { wakeLock = l; l.addEventListener('release', () => { wakeLock = null; }); }).catch(() => {}); } catch (e) {} }

window.addEventListener('keydown', e => {
  if (e.target === seedInput) { if (e.key === 'Escape') seedInput.blur(); return; }
  if (e.target.tagName === 'SELECT') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase(); let used = true;

  else if (k === 'r') roll();
  else if (k === 'arrowright') worldStep(1); else if (k === 'arrowleft') worldStep(-1);
  else if (k === 'arrowup') setPal(-1); else if (k === 'arrowdown' || k === 'p') setPal(1);
  else if (k === 'd') setDit(1); else if (k === 'x') setPx(); else if (k === 'm') setMode();
  else if (k === 'o') toggle('orbits'); else if (k === 'c') toggle('lines'); else if (k === 'l') toggle('labels');
  else if (k === 'f') fullscreen(); else if (k === 'h') setCollapsed(!S.collapsed);
  else if (k === 'escape' || k === '0') { setFocus(null, QUICK); hold(); }
  else used = false;
  if (used && k !== ' ') e.preventDefault(); else if (k === ' ' && e.target.tagName !== 'BUTTON') e.preventDefault();
});
window.addEventListener('resize', resize);

/* ───────────── start ───────────── */
function start() {
  applyPalette(); syncUI(); resize();
  if (!savedCollapse && Math.min(window.innerWidth, window.innerHeight) < 520) S.collapsed = true; // phones: sky first, controls a tap away
  setCollapsed(S.collapsed);
  let seed = '';
  try { seed = decodeURIComponent((location.hash || '').slice(1)); } catch (e) {}
  if (!/^[A-Za-z0-9-]{1,40}$/.test(seed)) seed = randomSeed();
  loadSystem(seed);
  wake();
  requestAnimationFrame(frame);
}
// small hook for tinkering from the console
window.quietOrbits = { _zoom: () => cam.zoom, visit: s => warp(s), focus: i => setFocus(i < 0 ? null : sys.planets[i] || sys.star), get system() { return sys; },
  _step: (dt, n) => { for (let i = 0; i < (n || 1); i++) step(dt); render(); }, _probe: (b, x, y, z) => { b.surf(x, y, z, 4); return [sR, sG, sB, sSpec, sTag]; }, _load: s => { loadSystem(String(s)); fade = 1; }, _gen: s => generate(String(s)), _settle: () => { fade = 1; cam.tr = null; labelT = 5; }, _set: (k, v) => { S[k] = v; applyPalette(); buildThr(); syncUI(); } };
start();
})();
